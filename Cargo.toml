[package]
name = "chop-chop"
version = "1.7.4"
edition = "2021"
description = "Chop Chop Splitter: cut a clip or batch-split a video into parts, with audio export (GTK 3, multicore, Yaru icons)"
license = "MIT"

[dependencies]
gtk = "0.18"

[build-dependencies]
glib-build-tools = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
