<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7955F"/>
      <stop offset="0.55" stop-color="#E95420"/>
      <stop offset="1" stop-color="#C7381A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="leftCut"><polygon points="0,0 142,0 114,256 0,256"/></clipPath>
    <clipPath id="rightCut"><polygon points="142,0 256,0 256,256 114,256"/></clipPath>
    <!-- One film strip, drawn once and cut in two -->
    <g id="strip">
      <rect x="46" y="88" width="164" height="80" rx="10" fill="#FFF8F3"/>
      <g fill="#5E2750">
        <rect x="58" y="104" width="40" height="48" rx="7"/>
        <rect x="108" y="104" width="40" height="48" rx="7"/>
        <rect x="158" y="104" width="40" height="48" rx="7"/>
      </g>
      <g fill="#E95420" opacity="0.85">
        <rect x="54" y="93" width="10" height="7" rx="2"/><rect x="75" y="93" width="10" height="7" rx="2"/>
        <rect x="96" y="93" width="10" height="7" rx="2"/><rect x="117" y="93" width="10" height="7" rx="2"/>
        <rect x="138" y="93" width="10" height="7" rx="2"/><rect x="159" y="93" width="10" height="7" rx="2"/>
        <rect x="180" y="93" width="10" height="7" rx="2"/>
        <rect x="54" y="156" width="10" height="7" rx="2"/><rect x="75" y="156" width="10" height="7" rx="2"/>
        <rect x="96" y="156" width="10" height="7" rx="2"/><rect x="117" y="156" width="10" height="7" rx="2"/>
        <rect x="138" y="156" width="10" height="7" rx="2"/><rect x="159" y="156" width="10" height="7" rx="2"/>
        <rect x="180" y="156" width="10" height="7" rx="2"/>
      </g>
    </g>
  </defs>

  <!-- Yaru-style rounded tile -->
  <rect x="12" y="14" width="232" height="232" rx="54" fill="#000" opacity="0.18"/>
  <rect x="12" y="10" width="232" height="232" rx="54" fill="url(#bg)"/>
  <rect x="12" y="10" width="232" height="116" rx="54" fill="url(#shine)"/>

  <!-- Left half, flying left -->
  <g transform="translate(-6,-8) rotate(-7 114 128) translate(128 128) scale(1.04) translate(-128 -128)">
    <g clip-path="url(#leftCut)" transform="translate(0,4)"><use href="#strip" opacity="0.18"/></g>
    <g clip-path="url(#leftCut)"><use href="#strip"/></g>
  </g>
  <!-- Right half, flying right -->
  <g transform="translate(6,8) rotate(7 142 128) translate(128 128) scale(1.04) translate(-128 -128)">
    <g clip-path="url(#rightCut)" transform="translate(0,4)"><use href="#strip" opacity="0.18"/></g>
    <g clip-path="url(#rightCut)"><use href="#strip"/></g>
  </g>

  <!-- The chop: a clean slash through the gap -->
  <line x1="151" y1="40" x2="105" y2="216" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
</svg>
